name: SDA Matrimony CI/CD Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  typescript-validation:
    name: Monorepo Typecheck & Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run generate --workspace=@sda/database

      - name: Run TypeScript Typecheck
        run: npm run typecheck

  python-ai-tests:
    name: AI Engine Unit Tests & Moderation Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: 3.11
          cache: 'pip'

      - name: Install AI Engine Requirements
        working-directory: apps/ai-engine
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit Tests
        working-directory: apps/ai-engine
        run: python -m unittest test_ai_engine.py

  docker-build-verification:
    name: Container Build Verification
    runs-on: ubuntu-latest
    needs: [typescript-validation, python-ai-tests]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Core API Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/api-core/Dockerfile
          push: false

      - name: Build Realtime Gateway Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/api-realtime/Dockerfile
          push: false

      - name: Build AI Engine Container
        uses: docker/build-push-action@v5
        with:
          context: ./apps/ai-engine
          file: ./apps/ai-engine/Dockerfile
          push: false
