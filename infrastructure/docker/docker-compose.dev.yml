version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sda_matrimony_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sda_matrimony_user
      POSTGRES_PASSWORD: sda_matrimony_secure_password
      POSTGRES_DB: sda_matrimony_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sda_matrimony_user -d sda_matrimony_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sda_matrimony_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: sda_matrimony_minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb local/sda-matrimony-media --ignore-existing;
      /usr/bin/mc anonymous set public local/sda-matrimony-media;
      exit 0;
      "

volumes:
  postgres_data:
  redis_data:
  minio_data:
